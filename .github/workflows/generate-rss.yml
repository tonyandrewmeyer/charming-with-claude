name: Generate RSS Feed

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/**'
      - 'READTHEM.md'
      - 'generate_rss.py'
      - '.github/workflows/generate-rss.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch all history for git log
          
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          
      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
          
      - name: Generate RSS feed
        run: |
          if ! uv run generate_rss.py; then
            echo "Error: RSS feed generation failed"
            exit 1
          fi
        
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet feed.rss; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push RSS feed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.rss
          git commit -m "chore: update RSS feed"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp feed.rss _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
