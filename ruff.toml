line-length = 99
# Bundled agent-skill assets, vendored per experiment.
extend-exclude = [".claude"]

[lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    # Method docstrings are not mandated; module/class/function docs are.
    "D102",
    # This tool deliberately shells out to juju/charmcraft/snap.
    "S603",
    "S607",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # These are local, single-user analysis tools: they bind 0.0.0.0 inside a
    # container, shell out to fixed helper binaries, and build SQL only from
    # internally-derived column names (all values stay bound to placeholders).
    "S104",
    "S603",
    "S607",
    "S608",
    # `random` is used to shuffle review order, never for secrets.
    "S311",
    # `round` is the review-round domain term and is part of the query API.
    "A002",
]

[lint.per-file-ignores]
# These hold Markdown report bodies and LLM prompt text in triple-quoted
# strings: re-wrapping them would change the generated output and the text
# sent to the model, so line length is dictated by the content.
"**/classify.py" = ["E501"]
"**/generate_writeups.py" = ["E501"]
"**/score_responses.py" = ["E501"]
"**/tests/**" = ["S101", "D", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
