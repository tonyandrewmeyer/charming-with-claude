[project]
name = "llms-txt-experiment"
version = "0.1.0"
description = "Tools for the llms.txt docs experiment"
requires-python = ">=3.12"
dependencies = [
    "textual~=1.0",
]

[tool.uv]
# Create venv with: uv venv && uv pip install -e .
# Or if the experiment dir has filesystem issues:
#   uv venv /tmp/llms-experiment-venv
#   source /tmp/llms-experiment-venv/bin/activate
#   uv pip install textual

[tool.ruff]
extend-exclude = ["lib"]
line-length = 99

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # A local, single-user analysis tool: it binds 0.0.0.0 inside a container,
    # shells out to fixed helper binaries, and builds SQL only from internally
    # derived column names (all values stay bound to placeholders).
    "S104",
    "S603",
    "S607",
    "S608",
    # `random` only shuffles review order, never generates secrets.
    "S311",
    # `round` is the review-round domain term and part of the query API.
    "A002",
    # Logging setup must never itself raise during start-up.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# Holds LLM prompt text in triple-quoted strings: re-wrapping would change
# the text sent to the model, so line length is dictated by the content.
"**/score_responses.py" = ["E501"]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
