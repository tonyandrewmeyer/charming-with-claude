[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-tool"
version = "0.1.0"
description = "Bug finding review tool for charm-find-bugs skill validation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "httpx>=0.25.0",
    "pygments>=2.17.0",
    "python-multipart>=0.0.6",
    "markdown>=3.5.0",
    "textual>=0.75.0",
]

[project.scripts]
review-tool = "review_tool.cli:cli"

[tool.ruff]
extend-exclude = ["lib"]
line-length = 99

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # A local, single-user analysis tool: it binds 0.0.0.0 inside a container,
    # shells out to fixed helper binaries, and builds SQL only from internally
    # derived column names (all values stay bound to placeholders).
    "S104",
    "S603",
    "S607",
    "S608",
    # `random` only shuffles review order, never generates secrets.
    "S311",
    # `round` is the review-round domain term and part of the query API.
    "A002",
    # Logging setup must never itself raise during start-up.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
